name: Urban Sky
description: Urban Sky is a Denver-based aerospace company, founded in 2016, that designs
  and operates reusable stratospheric microballoons for high-altitude remote sensing,
  persistent aerial surveillance, communications relay, and atmospheric data collection.
  Its balloons launch in under five minutes, float at 61,000-75,000 feet for multi-day
  missions, and carry the modular Wallabee payload platform with RGB, VNIR, and LWIR
  thermal sensors delivering 10cm-resolution imagery with real-time downlink. Through
  its Atmosys software platform, Urban Sky publishes an SDK for developers (JavaScript
  and Python, delivered via CDN loader) that streams real-time balloon telemetry over
  WebSocket and provides mission imagery access, serving defense and intelligence,
  commercial monitoring, and science and weather markets. Urban Sky is a Techstars
  portfolio company.
